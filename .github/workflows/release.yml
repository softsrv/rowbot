name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version to deploy (must match a pushed git tag, e.g. v0.1.0)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Needed now that the deploy step reads deploy/service.yaml from the
      # repo (the release.yml build before this didn't need repo contents at
      # all — it only called the GitHub API and gcloud directly).
      - name: Check out code
        uses: actions/checkout@v7

      - name: Validate version format
        run: |
          if ! [[ "${VERSION}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'${VERSION}' is not a valid release version — expected format: vX.Y.Z (e.g. v0.1.0)"
            exit 1
          fi
        env:
          VERSION: ${{ inputs.version }}

      # Confirms this version was actually released (a matching git tag was
      # pushed, which is what triggers docker-publish.yml to build and push
      # the image) rather than deploying an arbitrary/typo'd version that was
      # never built.
      - name: Verify version matches a real release
        id: check
        run: |
          if ! gh api "repos/${{ github.repository }}/git/ref/tags/${VERSION}" >/dev/null 2>&1; then
            echo "::error::No git tag '${VERSION}' found in ${{ github.repository }} — this version was never released."
            exit 1
          fi
          echo "found release tag: ${VERSION}"

          # docker/metadata-action's semver tag handler strips the leading
          # "v" when naming the image (see docker-publish.yml) — git tag
          # v1.2.3 is published to Docker Hub as tag 1.2.3, not v1.2.3.
          echo "image_tag=${VERSION#v}" >> "$GITHUB_OUTPUT"
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}

      - name: GCloud Auth
        uses: google-github-actions/auth@v3
        with:
          credentials_json: "${{ secrets.GCP_ACCOUNT_JSON }}"

      - name: setup-gcloud-sdk
        uses: google-github-actions/setup-gcloud@v3

      # deploy/service.yaml is the single source of truth for the service's
      # config — everything except the image tag (which changes per release,
      # so it's substituted here rather than hand-edited) lives there, not in
      # this workflow or the Cloud Run console.
      - name: Render Cloud Run service YAML
        run: sed "s|__IMAGE__|trriplejay/rowbot:${IMAGE_TAG}|" deploy/service.yaml > /tmp/service.yaml
        env:
          IMAGE_TAG: ${{ steps.check.outputs.image_tag }}

      # services replace sets the live service to exactly this spec (not a
      # merge) — anything configured by hand in the console that isn't in
      # deploy/service.yaml gets reset on every deploy.
      - name: Deploy to Cloud Run
        run: gcloud run services replace /tmp/service.yaml --region us-central1
