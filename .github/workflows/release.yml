name: Release

# Fires on a version tag push (e.g. v1.2.3) — tagging a release is the
# explicit trigger to build, publish, and deploy, not every commit to main.
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

env:
  IMAGE_NAME: rowbot

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Derives image tags from the pushed git tag, e.g. refs/tags/v1.2.3 ->
      # docker.io/<user>/rowbot:1.2.3 and :latest. The semver handler strips
      # the leading "v" — git tag v1.2.3 is published as tag 1.2.3.
      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          build-args: |
            APP_ENV=production
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: GCloud Auth
        uses: google-github-actions/auth@v3
        with:
          credentials_json: "${{ secrets.GCP_ACCOUNT_JSON }}"

      - name: setup-gcloud-sdk
        uses: google-github-actions/setup-gcloud@v3

      # Deploy the exact image just built and pushed above — reuses the same
      # "v" stripping as the Docker tag so the two never drift apart.
      - name: Compute deploy image tag
        id: img
        run: echo "image_tag=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # deploy/service.yaml is the single source of truth for the service's
      # config — everything except the image tag (which changes per release,
      # so it's substituted here rather than hand-edited) lives there, not in
      # this workflow or the Cloud Run console.
      - name: Render Cloud Run service YAML
        run: sed "s|__IMAGE__|${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${IMAGE_TAG}|" deploy/service.yaml > /tmp/service.yaml
        env:
          IMAGE_TAG: ${{ steps.img.outputs.image_tag }}

      # services replace sets the live service to exactly this spec (not a
      # merge) — anything configured by hand in the console that isn't in
      # deploy/service.yaml gets reset on every deploy.
      - name: Deploy to Cloud Run
        run: gcloud run services replace /tmp/service.yaml --region us-central1
