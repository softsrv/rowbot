name: CI

on:
  push:
    branches:
      - main
    # make release's commit only touches CHANGELOG.md — nothing `make check`
    # covers actually changed, so skip the run.
    paths-ignore:
      - "CHANGELOG.md"
  pull_request:
    paths-ignore:
      - "CHANGELOG.md"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # make check also runs staticcheck and govulncheck, which aren't part
      # of the Go toolchain — install them once per run, same as the
      # one-time local setup documented in the Makefile.
      - name: Install staticcheck and govulncheck
        run: |
          # staticcheck dev build: no tagged release yet decodes Go 1.27.2's
          # export-data v5 (v0.8.1 is newest tag and still errors); this
          # pseudo-version is the first that supports the 1.27 toolchain.
          go install honnef.co/go/tools/cmd/staticcheck@v0.7.0-0.dev.0.20261009230814-452d5bb86b45
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: make check
        run: make check

      - name: make test
        run: make test
