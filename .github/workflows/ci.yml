name: CI

on:
  push:
    branches:
      - main
    # make release's commit only touches CHANGELOG.md — nothing `make check`
    # covers actually changed, so skip the run.
    paths-ignore:
      - "CHANGELOG.md"
  pull_request:
    paths-ignore:
      - "CHANGELOG.md"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # make check also runs staticcheck and govulncheck, which aren't part
      # of the Go toolchain — install them once per run, same as the
      # one-time local setup documented in the Makefile.
      - name: Install staticcheck and govulncheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          go install golang.org/x/vuln/cmd/govulncheck@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: make check
        run: make check

      - name: make test
        run: make test
