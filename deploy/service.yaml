# Cloud Run service definition — the single source of truth for how rowbot
# is deployed. Applied via `gcloud run services replace`, which sets the
# service to exactly this spec (not a merge with whatever's already
# configured in the console) — anything you change by hand in the Cloud Run
# UI will be overwritten by the next deploy unless it's reflected here too.
#
# The container image placeholder below is substituted by
# .github/workflows/release.yml at deploy time — don't fill that one in by
# hand, everything can be configured.
# see official reference: https://docs.cloud.google.com/run/docs/reference/yaml/v1
#
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: rowbot
spec:
  template:
    # To set any revision-level annotations — e.g. to keep an instance always
    # warm (autoscaling.knative.dev/minScale: "1", trading cost for no cold
    # starts) or to keep CPU allocated between requests rather than only
    # while actively handling one (run.googleapis.com/cpu-throttling:
    # "false" — relevant to cmd/app's background token-cleanup goroutine,
    # which needs CPU on its own daily schedule regardless of in-flight
    # requests) — add the block below. A "metadata:" key present with
    # nothing under it parses as null, not an empty map, and gcloud will
    # reject it — so leave this section out entirely unless you're actually
    # using it, don't just add "metadata:" with everything else commented:
    #
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "5"
        run.googleapis.com/cpu-throttling: "true"
    spec:
      containerConcurrency: 80
      timeoutSeconds: 60
      serviceAccountName: cloud-run-deployer@softsrv-206519.iam.gserviceaccount.com
      containers:
        - image: __IMAGE__
          ports:
            - containerPort: 8080
          env:
            - name: ENV_FILE_PATH
              value: /etc/secrets/.env
          resources:
            limits:
              cpu: "1"
              memory: 128Mi
          volumeMounts:
            - name: env-file
              mountPath: /etc/secrets
          startupProbe:
            timeoutSeconds: 30
            periodSeconds: 30
            failureThreshold: 1
            tcpSocket:
              port: 8080
      volumes:
        - name: env-file
          secret:
            secretName: rowbot-env
            items:
              - key: latest
                path: .env
