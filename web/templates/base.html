<!DOCTYPE html>
<!-- To switch themes, change data-theme to any DaisyUI theme name.
     Built-in themes: light, dark, cupcake, dracula, synthwave, retro,
     cyberpunk, valentine, halloween, garden, forest, aqua, lofi, pastel,
     fantasy, wireframe, black, luxury, cmyk, autumn, business, acid,
     lemonade, night, coffee, winter, dim, nord, sunset, and more.
     Full list: https://daisyui.com/docs/themes/ -->
<html lang="en" data-theme="business">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{block "title" .}}RowBot{{end}}</title>
  <link rel="icon" type="image/png" href="/static/img/rowboticon.png" />
  <link rel="stylesheet" href="/static/css/dist/app.css" />
  <script src="/static/js/htmx.min.js"></script>
  <script src="/static/js/app.js" defer></script>
</head>
<body class="flex min-h-screen flex-col bg-base-200">
  <nav class="navbar bg-base-100 shadow-sm px-4">
    <div class="flex-1">
      <a href="/" class="flex items-center gap-2 text-xl font-bold">
        <img src="/static/img/rowboticon.png" alt="" class="h-8 w-8 rounded-md" />
        RowBot
      </a>
    </div>
    <div class="flex-none gap-2">
      <a href="/pricing" class="btn btn-ghost btn-sm">Pricing</a>
      {{if .User}}
      <div class="dropdown dropdown-end">
        <div tabindex="0" role="button" class="btn btn-ghost btn-circle">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
          </svg>
        </div>
        <ul tabindex="0" class="dropdown-content menu menu-sm z-[1] mt-3 w-48 rounded-box bg-base-100 shadow">
          <li><a href="/profile" class="flex w-full cursor-pointer items-center rounded-btn px-4 py-2 text-left text-sm hover:bg-base-200 active:bg-base-300">Profile</a></li>
          <li>
            <form method="post" action="/auth/logout" class="contents">
              <button type="submit" class="flex w-full cursor-pointer items-center rounded-btn px-4 py-2 text-left text-sm hover:bg-base-200 active:bg-base-300">Sign Out</button>
            </form>
          </li>
        </ul>
      </div>
      {{else}}
      {{block "nav-actions" .}}
      <a href="/auth/discord/login" class="btn btn-outline btn-xs sm:btn-sm">Login via Discord</a>
      {{end}}
      {{end}}
    </div>
  </nav>

  <main class="flex flex-1 flex-col {{block "main-class" .}}container mx-auto px-4 py-8 max-w-md{{end}}">
    {{block "content" .}}{{end}}
  </main>

  <footer class="footer footer-center bg-base-100 p-4 text-sm text-base-content/60">
    <nav class="flex gap-4">
      <a href="/terms" class="link link-hover">Terms of Service</a>
      <a href="/privacy" class="link link-hover">Privacy Policy</a>
    </nav>
    <aside>
      <p>&copy; 2026 softsrv</p>
    </aside>
  </footer>
</body>
</html>
